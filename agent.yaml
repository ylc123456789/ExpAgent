name: expagent
version: "2.0"
role: scientific_advisor
description_for_router: |
  科学顾问（科学专家）。负责科学判断：实验设计、结果分析、失败归因、
  文献检索。只产出逻辑科学动作图，不选择执行模块、不写路径、不跑实验。
  提供能力：analyze_results（解释指标/比较方法/判断假设）、search_literature（检索论文）。
capabilities:
  - analyze_results
  - search_literature
side_effects: none
input_contract: advise(AdvisorContext) -> ScientificDecision
status: available
